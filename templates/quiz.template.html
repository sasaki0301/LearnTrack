<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson Quiz</title>
</head>
<body>
  <main class="quiz-container">
    <h1>Lesson Quiz</h1>
    <div class="progress-text" id="progressText"></div>
    <div class="progress-wrapper" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    <section id="quizStage"></section>
    <div class="quiz-nav">
      <button class="quiz-btn" type="button" id="backBtn">Back to Lesson</button>
      <button class="quiz-btn primary" type="button" id="nextBtn" disabled>Next</button>
    </div>
  </main>

  <script>
    var quizData = [
      { q: 'Question 1 text goes here.', choices: ['Choice A', 'Choice B', 'Choice C', 'Choice D'], answer: 0, explanation: 'Explain why this answer is correct.' },
      { q: 'Question 2 text goes here.', choices: ['Choice A', 'Choice B', 'Choice C', 'Choice D'], answer: 1, explanation: 'Explain why this answer is correct.' }
    ];
    var current = 0, score = 0;
    var answered = new Array(quizData.length).fill(false);
    var stage = document.getElementById('quizStage');
    var progressText = document.getElementById('progressText');
    var progressBar = document.getElementById('progressBar');
    var nextBtn = document.getElementById('nextBtn');
    var backBtn = document.getElementById('backBtn');

    function escapeHtml(value) { return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function renderQuestion() {
      var item = quizData[current];
      nextBtn.disabled = true;
      nextBtn.textContent = current === quizData.length - 1 ? 'Finish Quiz' : 'Next';
      progressText.textContent = 'Question ' + (current + 1) + ' of ' + quizData.length;
      progressBar.style.width = Math.round((current / quizData.length) * 100) + '%';
      stage.innerHTML = '<div class="question">' + escapeHtml(item.q) + '</div><div class="choices">' + item.choices.map(function (choice, index) { return '<button class="choice" type="button" data-choice="' + index + '">' + escapeHtml(choice) + '</button>'; }).join('') + '</div><div class="explanation" id="explanation" hidden></div>';
    }
    function chooseAnswer(index) {
      if (answered[current]) return;
      var item = quizData[current];
      answered[current] = true;
      stage.querySelectorAll('.choice').forEach(function (button, buttonIndex) {
        button.disabled = true;
        if (buttonIndex === item.answer) button.classList.add('correct');
        if (buttonIndex === index && index !== item.answer) button.classList.add('incorrect');
      });
      if (index === item.answer) score += 1;
      var explanation = document.getElementById('explanation');
      explanation.hidden = false;
      explanation.textContent = item.explanation || '';
      nextBtn.disabled = false;
    }
    function next() {
      if (!answered[current]) return;
      if (current < quizData.length - 1) { current += 1; renderQuestion(); return; }
      var percent = Math.round((score / quizData.length) * 100);
      progressText.textContent = 'Quiz complete';
      progressBar.style.width = '100%';
      stage.innerHTML = '<div class="question">Your score: ' + percent + '%</div><div class="explanation">You answered ' + score + ' out of ' + quizData.length + ' correctly.</div>';
      nextBtn.textContent = 'Continue';
      nextBtn.onclick = function () { window.parent.postMessage({ type: 'quizResult', score: percent }, '*'); window.parent.postMessage({ type: 'quizNextLesson' }, '*'); };
    }
    stage.addEventListener('click', function (event) { var choice = event.target.closest('[data-choice]'); if (choice) chooseAnswer(Number(choice.getAttribute('data-choice'))); });
    nextBtn.addEventListener('click', next);
    backBtn.addEventListener('click', function () { window.parent.postMessage({ type: 'quizBack' }, '*'); });
    renderQuestion();
  </script>
</body>
</html>
